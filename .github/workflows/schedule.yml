name: Daily Animal Portrait

# Triggered externally by cron-job.org, which POSTs to the workflow_dispatch
# endpoint at 08:00 America/New_York. cron-job.org handles DST, so there is
# deliberately no cron expression in this file.
on:
  workflow_dispatch:

# contents: write lets the run commit log.csv back to the repo.
permissions:
  contents: write

concurrency:
  group: daily-portrait
  cancel-in-progress: false

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and post portrait
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          OUTPUT_DIR: output
          LOG_FILE: log.csv
        run: python main.py

      # Only reached when the step above exits 0. "git add" first, then diff
      # the index, so a brand-new log.csv is detected (plain "git diff"
      # ignores untracked files).
      - name: Commit the log
        run: |
          git add log.csv 2>/dev/null || true
          if git diff --cached --quiet -- log.csv; then
            echo "log.csv unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: log $(tail -n 1 log.csv | cut -d, -f1)"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
